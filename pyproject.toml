[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskflow"
version = "0.3.0"
description = "Gestor de tareas en línea de comandos (proyecto de práctica)"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
taskflow = "taskflow.cli:main"

[tool.setuptools]
packages = ["taskflow"]

[tool.ruff]
line-length = 88
